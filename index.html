<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cristalería C&amp;R</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ac:#1f7a5a;--acx:#fff;--bd:#e3e1d9;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161714;--card:#202220;--tx:#eeede8;--mu:#a09f97;--ac:#4fc59a;--acx:#10231b;--bd:#33352f;--bad:#f2867f}}
:root[data-theme="dark"]{--bg:#161714;--card:#202220;--tx:#eeede8;--mu:#a09f97;--ac:#4fc59a;--acx:#10231b;--bd:#33352f;--bad:#f2867f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 12px 80px}
h1{font-size:18px;margin:4px 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
nav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.k small{color:var(--mu);display:block}.k b{font-size:19px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font:inherit;font-weight:600;cursor:pointer}
.sw{display:flex;gap:6px;margin-bottom:6px}
.sw button{flex:1;padding:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
.sw button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;overflow-x:auto;padding-top:6px}
.bar{flex:1 0 38px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer}
.bar i{display:block;width:100%;background:var(--bd);border-radius:6px 6px 0 0;min-height:3px}
.bar.best i{background:var(--ac)}.bar.sel i{outline:2px solid var(--tx)}
.bar span{font-size:11px;color:var(--mu);margin-top:3px;white-space:nowrap}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.li:first-child{border-top:0}.li small{color:var(--mu);display:block}
.x{background:none;border:1px solid var(--bd);border-radius:8px;color:var(--mu);cursor:pointer;font:inherit;padding:4px 8px;margin-left:6px}
.bad{color:var(--bad)}.mu{color:var(--mu)}
#msg{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 12px;border-radius:10px;display:none;z-index:9}
.wrap{overflow-x:auto}
</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head><body><main>
<h1>🪟 Cristalería C&amp;R</h1>
<div id="login" class="card" style="display:none">
<b>Iniciar sesión</b>
<label>Correo</label><input id="le" type="email" autocomplete="username" inputmode="email">
<label>Contraseña</label><input id="lp" type="password" autocomplete="current-password">
<button class="btn" id="lb">Entrar</button><div id="lerr" class="bad" style="margin-top:8px"></div></div>
<div id="app" style="display:none">
<div style="text-align:right"><button id="out" style="border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer">Salir</button></div>
<nav id="nav"></nav>
<div id="view"></div></div>
</main><div id="msg"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={products:[],sales:[],purchases:[],moves:[],cierres:[],cfg:{},cnt:{},dirty:false};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let db=null,tab='resumen',metric='v',selM=null,pend=null;
const money=n=>'Q'+(Math.round((n||0)*100)/100).toLocaleString('es',{maximumFractionDigits:2});
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mlabel=k=>MES[+k.slice(5,7)-1]+' '+k.slice(2,4);
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2600)}
async function add(col,data){if(!db){toast('Sin conexión a la base de datos');return false}
  try{await db.collection(col).add({...data,ts:Date.now()});return true}catch(e){toast('Error al guardar: '+(e.message||e.code));return false}}
async function del(col,id,btn){if(pend!==id){pend=id;btn.textContent='¿Seguro? Toca otra vez';setTimeout(()=>{pend=null;btn.textContent='🗑'},3000);return}
  pend=null;try{await db.collection(col).doc(id).delete();toast('Borrado ✔')}catch(e){toast('No se pudo borrar')}}
const stock=p=>(p.stock0||0)+sum(S.purchases.filter(x=>x.pid===p.id&&!x.hist),x=>x.qty)-sum(S.sales.filter(x=>x.pid===p.id&&!x.hist),x=>x.qty);
const isG=m=>m.type==='gef'||m.type==='gba';
function caja(){
  const dep=sum(S.moves.filter(m=>m.type==='dep'),m=>m.amount),ret=sum(S.moves.filter(m=>m.type==='ret'),m=>m.amount);
  const gef=sum(S.moves.filter(m=>m.type==='gef'),m=>m.amount),gba=sum(S.moves.filter(m=>m.type==='gba'),m=>m.amount);
  const s=m=>sum(S.sales.filter(x=>x.method===m&&!x.hist),x=>x.qty*x.price),c=m=>sum(S.purchases.filter(x=>x.method===m&&!x.hist),x=>x.qty*x.cost);
  return{ef:(S.cfg.ef||0)+s('efectivo')-c('efectivo')-dep+ret-gef,ba:(S.cfg.ba||0)+s('banco')-c('banco')+dep-ret-gba,
    ventas:sum(S.sales,x=>x.qty*x.price),compras:sum(S.purchases,x=>x.qty*x.cost),gastos:gef+gba,
    ganancia:sum(S.sales.filter(x=>!x.hist),x=>x.qty*(x.price-x.cost))-gef-gba}}
function months(){const m={};const g=k=>m[k]=m[k]||{v:0,g:0,c:0,p:{}};
  S.sales.forEach(s=>{const o=g(s.date.slice(0,7)),t=s.qty*s.price;o.v+=t;if(!s.hist)o.g+=s.qty*(s.price-s.cost);o.p[s.name]=(o.p[s.name]||0)+t});
  S.moves.filter(isG).forEach(x=>{g(x.date.slice(0,7)).g-=x.amount});
  S.purchases.forEach(x=>{g(x.date.slice(0,7)).c+=x.qty*x.cost});return m}
const sel=(id,opts)=>`<select id="${id}">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`;
const MET=[['efectivo','Efectivo'],['banco','Banco / transferencia']];
const dl=()=>`<datalist id="pl">${S.products.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>`;
const num=id=>parseFloat($('#'+id).value);
const findP=n=>S.products.find(p=>p.name.trim().toLowerCase()===n.trim().toLowerCase());

const DEN=[['m1','Monedas de Q1',1],['b5','Billetes de Q5',5],['b10','Billetes de Q10',10],['b20','Billetes de Q20',20],['b50','Billetes de Q50',50],['b100','Billetes de Q100',100]];
const cashTotal=()=>sum(DEN,d=>(S.cnt[d[0]]||0)*d[2]);
function conteoTot(){let t=0;DEN.forEach(d=>{const n=Math.floor(parseFloat($('#q_'+d[0]).value)||0);t+=n*d[2];$('#s_'+d[0]).textContent=n?money(n*d[2]):''});
  $('#ct2').textContent=money(t)}
function recResumen(){const tc=sum(S.purchases,x=>x.qty*x.cost),tv=sum(S.sales,x=>x.qty*x.price),falta=tc>tv;
  $('#rec').innerHTML=`<b>Inversión vs ventas (total)</b><div class="li"><span>Invertido en compras</span><b>${money(tc)}</b></div><div class="li"><span>Vendido</span><b>${money(tv)}</b></div><div class="li"><span>${falta?'Por recuperar':'Ya recuperado, ganancia'}</span><b class="${falta?'bad':''}">${money(Math.abs(tv-tc))}</b></div>`}
let CART=[];
function renderCart(){const c=$('#cartc');if(!c)return;c.style.display=CART.length?'block':'none';
  $('#cl2').innerHTML=CART.map((x,i)=>`<div class="li"><div><span>${esc(x.name)} ×${x.qty}</span><small>${money(x.price)} c/u · ganancia ${money(x.qty*(x.price-x.cost))}</small></div><div><b>${money(x.qty*x.price)}</b><button class="x" data-r="${i}">🗑</button></div></div>`).join('');
  $('#ctot').textContent=money(sum(CART,x=>x.qty*x.price))}
const T={
resumen:{html:()=>`<div class="grid" id="kp"></div>
<div class="card" id="rec"></div>
<div class="card"><div class="sw"><button data-m="v">Ventas</button><button data-m="g">Ganancia</button></div>
<div id="best" class="mu"></div><div class="chart" id="ch"></div></div><div class="card" id="det"></div>
<div class="card" id="imp" style="display:none"><b>Importar datos del Excel</b><div class="mu" style="margin:4px 0 8px">Elige el archivo datos-cristaleria.json. Se hace una sola vez.</div><input id="impf" type="file" accept=".json,application/json"><div id="impm" class="mu" style="margin-top:6px"></div></div>`,
 bind(){document.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{metric=b.dataset.m;T.resumen.refresh()});$('#impf').onchange=importar},
 refresh(){$('#imp').style.display=S.pend?'block':'none';recResumen();const c=caja(),M=months(),keys=Object.keys(M).sort().slice(-12),cur=today().slice(0,7);
  $('#kp').innerHTML=[['Ventas del mes',money((M[cur]||{v:0}).v)],['Ganancia del mes',money((M[cur]||{g:0}).g)],['💵 Efectivo',money(cashTotal())],['🏦 Banco',money(c.ba)]].map(k=>`<div class="k"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('');
  document.querySelectorAll('.sw button').forEach(b=>b.classList.toggle('on',b.dataset.m===metric));
  if(!keys.length){$('#best').textContent='Aún no hay ventas registradas.';$('#ch').innerHTML='';$('#det').innerHTML='';return}
  const val=k=>Math.max(M[k][metric],0),mx=Math.max(...keys.map(val),1),best=keys.reduce((a,k)=>M[k][metric]>M[a][metric]?k:a,keys[0]);
  if(!selM||!M[selM])selM=best;
  $('#best').innerHTML=`Mejor mes en ${metric==='v'?'ventas':'ganancia'}: <b>${mlabel(best)}</b> (${money(M[best][metric])}). Toca una barra para ver el detalle.`;
  $('#ch').innerHTML=keys.map(k=>`<div class="bar${k===best?' best':''}${k===selM?' sel':''}" data-k="${k}"><i style="height:${val(k)/mx*115}px"></i><span>${mlabel(k)}</span></div>`).join('');
  document.querySelectorAll('.bar').forEach(b=>b.onclick=()=>{selM=b.dataset.k;T.resumen.refresh()});
  const o=M[selM],top=Object.entries(o.p).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $('#det').innerHTML=`<b>${mlabel(selM)}</b><div class="li"><span>Ventas</span><b>${money(o.v)}</b></div><div class="li"><span>Ganancia por producto (menos gastos)</span><b>${money(o.g)}</b></div><div class="li"><span>Invertido en compras</span><b>${money(o.c)}</b></div><div class="li"><span>${o.c>o.v?'Por recuperar':'Recuperado ✔ (ventas − compras)'}</span><b class="${o.c>o.v?'bad':''}">${money(Math.abs(o.v-o.c))}</b></div><div class="mu" style="margin-top:6px">Más vendidos</div>`+top.map(t=>`<div class="li"><span>${esc(t[0])}</span><span>${money(t[1])}</span></div>`).join('')}},

ventas:{html:()=>`<div class="card"><b>Nueva venta</b>
<label>Producto</label><input id="sn" list="pl" autocomplete="off" placeholder="Escribe o elige el producto"><span id="dl">${dl()}</span>
<div class="row"><div><label>Cantidad</label><input id="sq" type="number" inputmode="decimal" value="1" min="0"></div><div><label>Precio unitario</label><input id="sp" type="number" inputmode="decimal" min="0"></div></div>
<div id="sg" class="mu" style="margin-top:8px"></div>
<button class="btn" id="sb">+ Agregar a la venta</button></div>
<div class="card" id="cartc" style="display:none"><b>Productos en esta venta</b><div id="cl2"></div>
<div class="li"><span><b>Total</b></span><b id="ctot"></b></div>
<div class="row"><div><label>Pago</label>${sel('sm',MET)}</div><div><label>Fecha</label><input id="sd" type="date" value="${today()}"></div></div>
<button class="btn" id="cobrar">Cobrar venta</button></div>
<div class="card"><b id="st">Ventas</b><div id="sl"></div></div>`,
 bind(){const pg=()=>{const p=findP($('#sn').value),q=num('sq'),pr=num('sp');
   $('#sg').innerHTML=p&&q>0&&pr>=0?`Ganancia de este producto: <b>${money(q*(pr-(p.cost||0)))}</b> (costo ${money(p.cost||0)} c/u)`:(!p&&$('#sn').value.trim()?'Producto no registrado: no se puede calcular la ganancia':'')};
  $('#sn').oninput=()=>{const p=findP($('#sn').value);if(p)$('#sp').value=p.price;pg()};$('#sq').oninput=pg;$('#sp').oninput=pg;
  $('#sb').onclick=()=>{const name=$('#sn').value.trim(),qty=num('sq'),price=num('sp');
   if(!name||!(qty>0)||!(price>=0))return toast('Completa producto, cantidad y precio');
   const p=findP(name),en=sum(CART.filter(x=>p&&x.pid===p.id),x=>x.qty);
   if(p&&stock(p)<qty+en)toast('Aviso: solo hay '+stock(p)+' en inventario');
   CART.push({name:p?p.name:name,pid:p?p.id:null,qty,price,cost:p?p.cost||0:0});
   $('#sn').value='';$('#sp').value='';$('#sq').value=1;pg();renderCart();$('#sn').focus()};
  $('#cl2').onclick=e=>{const b=e.target.closest('[data-r]');if(b){CART.splice(+b.dataset.r,1);renderCart()}};
  $('#cobrar').onclick=async()=>{if(!CART.length)return;if(!db)return toast('Sin conexión');
   const date=$('#sd').value,method=$('#sm').value,ticket=Date.now().toString(36),ts=Date.now();
   try{const b=db.batch();CART.forEach((x,i)=>b.set(db.collection('sales').doc(),{date,name:x.name,pid:x.pid,qty:x.qty,price:x.price,cost:x.cost,method,ticket,ts:ts+i}));await b.commit();
    const t=sum(CART,x=>x.qty*x.price);CART=[];renderCart();toast('Venta cobrada ✔ '+money(t))}catch(e){toast('Error al guardar la venta')}};
  renderCart()},
 refresh(){$('#dl').innerHTML=dl();const t=today(),d=S.sales.filter(s=>s.date===t);
  $('#st').textContent='Hoy: '+money(sum(d,s=>s.qty*s.price))+' · '+d.length+' ventas';
  $('#sl').innerHTML=list('sales',[...S.sales].sort((a,b)=>b.ts-a.ts).slice(0,30),s=>`${esc(s.name)} ×${s.qty}`,s=>`${s.date} · ${s.method}`+(s.hist?'':` · ganancia ${money(s.qty*(s.price-s.cost))}`),s=>money(s.qty*s.price))}},

compras:{html:()=>`<div class="card"><b>Registrar compra de mercancía</b>
<label>Producto</label><input id="cn" list="pl" autocomplete="off" placeholder="Producto (nuevo o existente)"><span id="dl">${dl()}</span>
<div class="row"><div><label>Cantidad</label><input id="cq" type="number" inputmode="decimal" min="0"></div><div><label>Costo unitario</label><input id="cc" type="number" inputmode="decimal" min="0"></div></div>
<div class="row"><div><label>Precio de venta (opcional)</label><input id="cp" type="number" inputmode="decimal" min="0"></div><div><label>Pago</label>${sel('cm',MET)}</div></div>
<label>Fecha</label><input id="cd" type="date" value="${today()}">
<button class="btn" id="cb">Guardar compra</button></div><div class="card"><b id="ct">Compras</b><div id="cl"></div></div>`,
 bind(){$('#cn').oninput=()=>{const p=findP($('#cn').value);if(p){$('#cc').value=p.cost||'';$('#cp').value=p.price||''}};
  $('#cb').onclick=async()=>{const name=$('#cn').value.trim(),qty=num('cq'),cost=num('cc'),pr=num('cp');
   if(!name||!(qty>0)||!(cost>=0))return toast('Completa producto, cantidad y costo');
   if(!db)return toast('Sin conexión a la base de datos');
   let p=findP(name),pid;
   try{if(p){pid=p.id;const u={cost};if(pr>=0)u.price=pr;await db.collection('products').doc(pid).update(u)}
    else{const r=await db.collection('products').add({name,cost,price:pr>=0?pr:0,stock0:0,ts:Date.now()});pid=r.id}}catch(e){return toast('Error al guardar el producto')}
   if(await add('purchases',{date:$('#cd').value,name:p?p.name:name,pid,qty,cost,method:$('#cm').value})){['cn','cq','cc','cp'].forEach(i=>$('#'+i).value='');toast('Compra guardada ✔')}}},
 refresh(){$('#dl').innerHTML=dl();const m=today().slice(0,7),d=S.purchases.filter(s=>s.date.slice(0,7)===m);
  $('#ct').textContent='Compras del mes: '+money(sum(d,s=>s.qty*s.cost));
  $('#cl').innerHTML=list('purchases',[...S.purchases].sort((a,b)=>b.ts-a.ts).slice(0,30),s=>`${esc(s.name)} ×${s.qty}`,s=>`${s.date} · ${s.method}`,s=>money(s.qty*s.cost))}},

inventario:{html:()=>`<div class="card"><b>Agregar o actualizar producto</b>
<label>Nombre</label><input id="pn" autocomplete="off">
<div class="row"><div><label>Costo</label><input id="pc" type="number" inputmode="decimal" min="0"></div><div><label>Precio venta</label><input id="pp" type="number" inputmode="decimal" min="0"></div><div><label>Stock inicial</label><input id="ps" type="number" inputmode="decimal" min="0" value="0"></div></div>
<button class="btn" id="pb">Guardar producto</button><div class="mu" style="margin-top:6px;font-size:12px">Si el nombre ya existe, solo se actualizan costo y precio.</div></div>
<div class="card"><b id="it">Inventario</b><div id="il"></div></div>`,
 bind(){$('#pb').onclick=async()=>{const name=$('#pn').value.trim(),cost=num('pc')||0,price=num('pp')||0,s0=num('ps')||0;
   if(!name)return toast('Escribe el nombre');if(!db)return toast('Sin conexión');
   try{const p=findP(name);if(p)await db.collection('products').doc(p.id).update({cost,price});else await db.collection('products').add({name,cost,price,stock0:s0,ts:Date.now()});
    ['pn','pc','pp'].forEach(i=>$('#'+i).value='');toast('Producto guardado ✔')}catch(e){toast('Error al guardar')}}},
 refresh(){const ps=[...S.products].sort((a,b)=>a.name.localeCompare(b.name));
  $('#it').textContent='Inventario · valor a costo: '+money(sum(ps,p=>Math.max(stock(p),0)*(p.cost||0)));
  $('#il').innerHTML=list('products',ps,p=>esc(p.name),p=>`costo ${money(p.cost)} · venta ${money(p.price)}`,p=>{const s=stock(p);return`<span class="${s<=2?'bad':''}">${s} uds</span>`})}},
};
function acct(k){const ef=k==='ef',cur=ef?'efectivo':'banco';
 return{html:()=>`<div class="grid"><div class="k"><small>${ef?'💵 Saldo en caja':'🏦 Saldo en bancos'}</small><b id="bal"></b></div><div class="k"><small>${ef?'Último conteo guardado':'Saldo inicial'}</small><b id="ini"></b></div></div>
${ef?'':`<div class="card"><b>Saldo inicial</b><div class="row"><input id="si" type="number" inputmode="decimal" min="0" placeholder="Ej. ${ef?4000:9000}"><button class="btn" id="sb2" style="margin-top:0">Guardar</button></div></div>`}
${ef?`<div class="card"><b>Conteo de efectivo</b><div class="mu" style="font-size:12px;margin:2px 0 4px">El efectivo en caja es lo que cuentes aquí. Actualízalo cuando cuentes la caja.</div>${DEN.map(d=>`<div class="li"><span>${d[1]}</span><div style="display:flex;gap:8px;align-items:center"><input id="q_${d[0]}" type="number" inputmode="numeric" min="0" placeholder="0" style="width:76px"><span class="mu" id="s_${d[0]}" style="min-width:70px;text-align:right"></span></div></div>`).join('')}<div class="li"><span>Total contado</span><b id="ct2"></b></div><button class="btn" id="cb2">Guardar conteo</button></div>`:''}
<div class="card"><b>Movimiento</b><label>Tipo</label>${sel('mt',ef?[['dep','Depósito al banco (sale de caja)'],['ret','Retiro del banco (entra a caja)'],['gef','Gasto pagado en efectivo']]:[['dep','Depósito desde caja (entra al banco)'],['ret','Retiro a caja (sale del banco)'],['gba','Gasto pagado desde banco']])}

function cierreDia(d){const sv=m=>sum(S.sales.filter(x=>x.date===d&&x.method===m&&!x.hist),x=>x.qty*x.price),
  mv=t=>sum(S.moves.filter(x=>x.date===d&&x.type===t),x=>x.amount),
  prev=[...S.cierres].filter(c=>c.date<d).sort((a,b)=>b.date.localeCompare(a.date))[0];
  return{vef:sv('efectivo'),vba:sv('banco'),cp:sum(S.purchases.filter(x=>x.date===d&&x.method==='efectivo'&&!x.hist),x=>x.qty*x.cost),
   gef:mv('gef'),dep:mv('dep'),ret:mv('ret'),gan:sum(S.sales.filter(x=>x.date===d&&!x.hist),x=>x.qty*(x.price-x.cost))-mv('gef')-mv('gba'),prev:prev?prev.contado:null}}

 bind(){$('#cx_d').oninput=()=>{CX={ini:false,cont:false};T.cierre.refresh()};

 refresh(){const d=$('#cx_d').value||today(),r=cierreDia(d);

   +`<div class="li"><span><b>Efectivo esperado</b></span><b>${money(esp)}</b></div><div class="li"><span class="mu">Ventas en banco (no entran a caja)</span><span class="mu">${money(r.vba)}</span></div><div class="li"><span>Ganancia del día</span><b>${money(r.gan)}</b></div>`;

async function importar(e){const f=e.target.files[0];if(!f)return;const m=$('#impm');m.textContent='Leyendo archivo...';
 try{const d=JSON.parse(await f.text()),items=[];
  (d.products||[]).forEach(p=>{if(!findP(p.name))items.push(['products',p])});
  (d.sales||[]).forEach(x=>items.push(['sales',x]));(d.purchases||[]).forEach(x=>items.push(['purchases',x]));
  for(let i=0;i<items.length;i+=400){const b=db.batch();items.slice(i,i+400).forEach(([c,x])=>b.set(db.collection(c).doc(),x));await b.commit();m.textContent='Importando... '+Math.min(i+400,items.length)+' de '+items.length}
